[project]
name = "geospatial-portfolio"
version = "1.0.0"
description = "Professional geospatial engineering portfolio - Egehan Yaglici"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "osmnx>=2.0",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "contextily>=1.5",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",
    "requests>=2.31",
    "httpx>=0.27",
    "pystac-client>=0.8",
    "rioxarray>=0.15",
    "xarray>=2024.1",
    "scipy>=1.12",
    "scikit-image>=0.22",
    "pytest>=8.0",
    "folium>=0.16",
    "mapclassify>=2.6",
    "rio-cogeo>=5.0",
    "laspy>=2.5",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "mypy",
    "pytest-cov",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["01-cloud-urban-gis/tests", "02-spatial-api/tests", "03-geospatial-etl/tests", "04-rotterdam-elevation/tests", "05-sentinel1-sar/tests"]
